name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: glossy-agency-448211-s4
  GAR_LOCATION: us-central1
  SERVICE: techpartner-site
  REGION: us-central1
  NODE_VERSION: '20'

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            dist/
            client/dist/
          key: build-${{ github.sha }}

  deploy-staging:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            dist/
            client/dist/
          key: build-${{ github.sha }}

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and Push to Container Registry
        run: |
          docker build --platform linux/amd64 \
            -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/containers/${{ env.SERVICE }}-staging:${{ github.sha }}" \
            -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/containers/${{ env.SERVICE }}-staging:latest" .
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/containers/${{ env.SERVICE }}-staging:${{ github.sha }}"
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/containers/${{ env.SERVICE }}-staging:latest"

      - name: Deploy to Cloud Run Staging
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}-staging
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/containers/${{ env.SERVICE }}-staging:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --memory=1Gi
            --cpu=1
            --min-instances=0
            --max-instances=5
            --port=8080
            --allow-unauthenticated
            --set-env-vars=NODE_ENV=staging

  deploy-production:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            dist/
            client/dist/
          key: build-${{ github.sha }}

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and Push to Container Registry
        run: |
          docker build --platform linux/amd64 \
            -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/containers/${{ env.SERVICE }}:${{ github.sha }}" \
            -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/containers/${{ env.SERVICE }}:latest" .
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/containers/${{ env.SERVICE }}:${{ github.sha }}"
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/containers/${{ env.SERVICE }}:latest"

      - name: Deploy to Cloud Run Production
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/containers/${{ env.SERVICE }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --memory=2Gi
            --cpu=2
            --min-instances=0
            --max-instances=10
            --port=8080
            --allow-unauthenticated
            --set-env-vars=NODE_ENV=production

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            🚀 **Automated Release v${{ github.run_number }}**
            
            **Deployed to Production**: https://techpartner-site-flxd6wf2jq-uc.a.run.app
            
            **Changes in this release:**
            ${{ github.event.head_commit.message }}
            
            **Commit SHA**: ${{ github.sha }}
            **Deploy Time**: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false

  health-check:
    name: Health Check
    needs: [deploy-production]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://techpartner-site-flxd6wf2jq-uc.a.run.app/health || echo "000")
          if [ "$response" != "200" ]; then
            echo "❌ Health check failed with status code: $response"
            exit 1
          else
            echo "✅ Health check passed!"
          fi

      - name: Notify deployment success
        run: |
          echo "🎉 Deployment successful!"
          echo "🌐 Production URL: https://techpartner-site-flxd6wf2jq-uc.a.run.app"

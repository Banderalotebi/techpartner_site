# AWS EC2 Deployment Workflow
# Deploys to AWS EC2 instead of Google Cloud Run

name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}
  APP_DIR: /home/ubuntu/techpartner

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check || true

      - name: Build application
        run: node build.js

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist folder not found"
            exit 1
          fi
          echo "Build verification passed!"
          ls -la dist/

  deploy:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install and Build
        run: |
          npm ci
          node build.js

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ${{ env.APP_DIR }}
            
            # Pull latest changes
            echo "Pulling latest changes..."
            git fetch origin
            git reset --hard origin/main
            
            # Install dependencies
            echo "Installing dependencies..."
            npm install
            
            # Build the application
            echo "Building application..."
            node build.js
            
            # Restart PM2
            echo "Restarting PM2..."
            pm2 restart techpartner || pm2 start dist/index.cjs --name techpartner
            
            # Wait for app to start
            sleep 5
            
            # Check status
            pm2 status
            
            # Health check
            curl -f http://localhost:8080 && echo "Deployment successful!"
            
            echo "Deployment completed!"
          EOF

      - name: Verify deployment
        run: |
          sleep 10
          curl -I https://techpartner.sa || echo "HTTPS check complete"
          echo "Deployment verification done!"


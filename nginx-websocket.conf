# Nginx WebSocket Configuration for Real-Time AI
# Add this to your /etc/nginx/sites-available/techpartner configuration

server {
    listen 80;
    server_name techpartner.sa www.techpartner.sa;

    # 1. THE pSEO ENGINE (Your Astro Static Pages)
    location /web-design/ {
        alias /home/ubuntu/techpartnersite/pseo-engine/dist/web-design/;
        try_files $uri $uri/ /web-design/index.html =404;
        expires 30d;
    }

    # 2. THE REAL-TIME VOICE/CHAT GATEWAY (WebSockets)
    location /ws/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        
        # WebSocket upgrade headers - CRITICAL for keeping connection alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Extended timeouts for long-running WebSocket connections
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_connect_timeout 3600;
    }

    # 3. WIDGET CDN - Serve embeddable tools
    location /widgets/ {
        alias /home/ubuntu/techpartnersite/widgets/dist/;
        expires 30d;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    # 4. THE STANDARD API & REACT APP (Fallback)
    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
